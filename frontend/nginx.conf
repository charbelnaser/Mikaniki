server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;

  # Resolve "backend" through Docker's DNS on each request (cached 10 s): a fixed proxy_pass host is
  # resolved only at startup, so restarting the backend container (new IP) gave 502 until nginx restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8000;

  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;   # LLM answers can take a while
  }

  location /uploads/ {
    proxy_pass $backend;
  }

  # Angular routes -> index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
