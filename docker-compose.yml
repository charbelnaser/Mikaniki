services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: sqlite:////data/mikaniki.db
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - mikaniki-data:/data
    restart: unless-stopped
    # No published port: only the frontend's nginx reaches it (/api and /uploads are proxied)

  frontend:
    build: ./frontend
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  mikaniki-data:
